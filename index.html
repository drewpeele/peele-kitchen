<style>
:root{
  --bg:#FBF7F1; --card:#FFFFFF; --ink:#22201D; --muted:#7A736A; --line:#EAE1D5;
  --accent:#C45D3B; --accent-soft:#FBEDE6; --green:#4F7A52; --amber:#B0781F; --red:#B04A3A;
  --ice:#2F6D8C; --ice-soft:#E4F0F6;
  --green-soft:#EAF2EA; --amber-soft:#FAF2E0; --red-soft:#FAEAE7;
  --shadow:0 1px 2px rgba(34,32,29,.05), 0 6px 16px rgba(34,32,29,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15130F; --card:#1E1B17; --ink:#F2EBE0; --muted:#A0968A; --line:#302B24;
    --accent:#E58154; --accent-soft:#2A1D17; --green:#7FAF83; --amber:#D9A64A; --red:#E0806E;
    --ice:#7FBAD6; --ice-soft:#16242B;
    --green-soft:#1A2419; --amber-soft:#26200F; --red-soft:#2A1A16;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.35);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.hd{max-width:640px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:11px}
.mark{width:36px;height:36px;flex:0 0 36px;border-radius:10px;
  background:linear-gradient(140deg,#E58A60,#9B3E28);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.mark svg{width:22px;height:22px;display:block}
.hd h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hd .sub{margin:1px 0 0;font-size:11.5px;color:var(--muted);line-height:1.3}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 3px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.card h3{margin:14px 0 6px;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted)}
.card h3:first-child{margin-top:0}
p{margin:0 0 8px}
p:last-child{margin-bottom:0}
.small{font-size:13px;color:var(--muted);line-height:1.5}
.sec-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin:20px 2px 2px}
ul,ol{margin:0 0 0 0;padding-left:20px}
li{margin:0 0 5px}
li:last-child{margin-bottom:0}
b,strong{font-weight:650}
.tab-pane{display:none}
.tab-pane.on{display:block}

/* ---------- chips / pills ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;
  padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.5;
  max-width:100%;overflow-wrap:anywhere}
@media (max-width:430px){.chip{white-space:normal}}
.chip.ice{background:var(--ice-soft);color:var(--ice);border:1px solid var(--ice)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;
  padding:5px 11px;font-size:12.5px;font-weight:600;line-height:1.45}

/* ---------- freezer card ---------- */
.freezer{border:1.5px solid var(--ice);background:var(--ice-soft)}
.freezer h2{color:var(--ice)}
.thaw-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid rgba(127,186,214,.35)}
.thaw-row:first-of-type{border-top:0}
.thaw-dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--ice);margin-top:7px}
.thaw-b{flex:1;min-width:0}
.thaw-b .nm{font-weight:650;font-size:14.5px}
.thaw-b .wh{font-size:13px;color:var(--ink);opacity:.85;margin-top:2px}
.thaw-b .wy{font-size:12.5px;color:var(--muted);margin-top:3px}
.warn{margin-top:12px;background:var(--red-soft);border-radius:10px;padding:10px 12px;
  font-size:13px;color:var(--red);font-weight:600;line-height:1.45}
.nothing{margin-top:11px;font-size:13px;color:var(--ink);opacity:.8;line-height:1.5}

/* ---------- day cards ---------- */
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;
  box-shadow:var(--shadow);overflow:hidden}
.day-hd{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none}
.day-when{flex:0 0 44px;text-align:center}
.day-when .d{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day-when .n{font-size:19px;font-weight:700;line-height:1.1;margin-top:1px}
.day-mid{flex:1;min-width:0}
.day-mid .t{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.day-mid .n2{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.day-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.caret{flex:0 0 16px;margin-top:4px;color:var(--muted);transition:transform .18s ease}
.day.open .caret{transform:rotate(180deg)}
.day-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line);margin-top:2px}
.day.open .day-body{display:block}
.day-body h4{margin:12px 0 6px;font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted)}
.why{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;
  font-size:12.5px;color:var(--ink);line-height:1.5}
.day.committed{border-style:dashed;background:transparent}
.day.prep{border-color:var(--accent)}

/* ---------- shop ---------- */
.total-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;
  margin:12px 0;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px}
.total-card .big{font-size:27px;font-weight:750;letter-spacing:-.02em;line-height:1.05}
.total-card .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.left-badge{text-align:right;flex:0 0 auto}
.left-badge .n{font-size:20px;font-weight:750;color:var(--accent);line-height:1.1}
.left-badge .l{font-size:11px;color:var(--muted)}
.store-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  margin:12px 0;box-shadow:var(--shadow)}
.store-card .sname{font-size:15px;font-weight:700}
.store-card .stag{font-size:12.5px;color:var(--muted);margin-top:2px}
.meter{height:7px;border-radius:999px;background:var(--line);margin:11px 0 7px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;
  transition:width .22s ease}
.meter-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.aisle{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin:16px 0 4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.aisle:first-of-type{margin-top:12px}
.row{display:flex;align-items:flex-start;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line);
  cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.row:last-child{border-bottom:0}
.box{flex:0 0 20px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);
  margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s}
.box svg{width:12px;height:12px;opacity:0;transition:.15s;color:#fff}
.row.done .box{background:var(--green);border-color:var(--green)}
.row.done .box svg{opacity:1}
.row-mid{flex:1;min-width:0}
.row-mid .nm{font-size:14.5px;line-height:1.35}
.row-mid .nt{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.4}
.row .pr{flex:0 0 auto;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  font-weight:600;margin-top:1px}
.row.done .nm,.row.done .pr{text-decoration:line-through;opacity:.45}
.allset{background:var(--green-soft);border:1.5px solid var(--green)}
.allset h2{color:var(--green)}

/* ---------- SOS ---------- */
.sos-hero{background:linear-gradient(140deg,#E58A60,#9B3E28);color:#fff;border-radius:14px;
  padding:18px 16px;margin:12px 0;box-shadow:var(--shadow)}
.sos-hero h2{margin:0;font-size:19px;font-weight:750;letter-spacing:-.015em;color:#fff}
.sos-hero p{margin:5px 0 0;font-size:13.5px;color:rgba(255,255,255,.9);line-height:1.45}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 8px;margin:0 -14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;font-family:inherit;-webkit-tap-highlight-color:transparent}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.meal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  margin:9px 0;box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start}
.meal .mm{flex:1;min-width:0}
.meal .mn{font-size:14.5px;font-weight:650;line-height:1.3}
.meal .mt{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.shelf-grid{display:block}
.shelf-col{margin-top:14px}
.shelf-col:first-child{margin-top:0}

/* ---------- rules ---------- */
.flag{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.flag:last-child{border-bottom:0}
.flag .x{flex:0 0 auto;color:var(--red);font-weight:750}
.kv{margin:9px 0 0}
.kv .k{font-size:13.5px;font-weight:650}
.kv .v{font-size:13px;color:var(--muted);line-height:1.45;margin-top:1px}
.hill{background:var(--red-soft);border-radius:10px;padding:10px 12px;margin-top:10px;
  font-size:13px;line-height:1.5;color:var(--ink)}
.table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.table td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
.table tr:last-child td{border-bottom:0}
.table td:first-child{font-weight:650;padding-right:10px}
.table td:last-child{text-align:right;color:var(--muted);white-space:nowrap;font-weight:600}
.two{display:flex;gap:10px;flex-wrap:wrap}
.two>div{flex:1 1 150px;min-width:0}

/* ---------- tab bar ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:flex}
.nb{flex:1 1 0;min-width:0;background:none;border:0;padding:8px 2px 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
  font-family:inherit;font-size:10.5px;font-weight:650;-webkit-tap-highlight-color:transparent}
.nb svg{width:22px;height:22px;display:block}
.nb.on{color:var(--accent)}
.nb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
</style>
</head>

    "d": "3 cups dry long-grain white or jasmine rice, 4.5 cups water, 1 tsp salt. Lid on, bring to a boil, then low for 18 min, then off the heat for 5 min without lifting the lid. Spread it out on a sheet pan to cool for 15 min — that is what makes it fry properly Tuesday instead of clumping into paste. Then into two labelled containers: TUESDAY, about 5 cups, and THURSDAY, about 4 cups.",
    "m": "5 min hands-on, 30 min total"
   },
   {
    "t": "Brown the chili base and fridge it assembled",
    "d": "2 lb ground beef into a large skillet over medium-high, 7–8 min, breaking it up, until no pink is left — do not drain the fat, it is the flavour. Add 1 large diced yellow onion and 3 minced cloves of garlic, 4 min more, until the onion turns translucent. Off the heat, stir in 2 tbsp chili powder, 1 tbsp ground cumin, 2 tsp kosher salt and 1 tsp smoked paprika so the spices bloom in the hot fat. Cool 15 min, then one big container labelled MONDAY. Monday morning it is a single pour into the cooker. This is the most valuable task on the list.",
    "m": "15 min"

   {
    "t": "Strip the chicken carcass while it is still warm",
    "d": "After tonight's portions are carved, pull every remaining scrap off the bones — you should get about 3 cups — into a container labelled TUESDAY. Do it warm: warm chicken comes off in sheets, cold chicken fights you for twenty minutes. Bones into a freezer bag for stock.",
    "m": "6 min"
   },
   {
    "t": "Grate 16 oz of cheese",
    "d": "Two 8 oz blocks of sharp cheddar into one labelled container — 8 oz for Monday's chili, 4 oz for Wednesday's fend night, the rest for whatever Friday wants. Pre-shredded is coated in potato starch and will not melt cleanly. Best job on the list to hand the 10-year-old.",
    "m": "5 min"
   },
   {
    "t": "Hard-boil 12 eggs",
    "d": "Twelve eggs lowered into already-boiling water, 11 min at a low boil, then straight into an ice bath for 5 min — the ice bath is the entire reason they peel cleanly. Store them in the shell in the fridge, good for a full week. That is three school breakfasts and four lunchboxes, plus 4 eggs held back for Tuesday's fried rice.",

   },
   {
    "t": "Mix Thursday's honey-mustard glaze",
    "d": "3 tbsp honey, 2 tbsp dijon, 1 tbsp olive oil, 2 minced cloves of garlic, 1 tsp kosher salt and 1/2 tsp black pepper, whisked together in a jar. Lid on, into the fridge. Thursday it becomes one spoon instead of finding four things at 5:30pm on a practice night.",
    "m": "3 min"
   },
   {
    "t": "Cut the week's raw veg and fruit",
    "d": "2 lb of baby carrots into a container, 3 cucumbers sliced, 1 lb of grapes off the stem, 3 lb of apples washed, and 3 lb of fresh green beans with the ends snapped — 1.5 lb for tonight, 1.5 lb bagged for Thursday. All of it in clear containers at eye level in the fridge. The side dish only ever happens if it is already cut.",

const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e;};
const money = n => "$" + n.toFixed(2);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- header ---------- */
$("#hdSub").textContent = PLAN.week + " · Updated " + PLAN.updated;

/* ---------- WEEK tab ---------- */
function buildWeek(){
  const p = $("#pane-week");

  // (a) Freezer card — always first
  const f = el("div","card freezer");
  f.appendChild(el("h2",null,"Freezer — pull these out"));
  f.appendChild(el("p","small", esc(PLAN.thaw.lede)));
  PLAN.thaw.items.forEach(it=>{
    const r = el("div","thaw-row");
    r.appendChild(el("div","thaw-dot"));
    const b = el("div","thaw-b");
    b.appendChild(el("div","nm", esc(it.protein)));
    b.appendChild(el("div","wh","<b>"+esc(it.pull)+"</b> &nbsp;·&nbsp; for "+esc(it.forMeal)));
    b.appendChild(el("div","wy", esc(it.why)));
    r.appendChild(b);
    f.appendChild(r);
  });
  f.appendChild(el("div","nothing","<b>Nothing to pull:</b> "+esc(PLAN.thaw.nothing)));
  f.appendChild(el("div","warn", esc(PLAN.thaw.counterRule)));
  p.appendChild(f);

  // (b) day cards
  p.appendChild(el("div","sec-title","The week"));
  PLAN.days.forEach(d=>{
    const c = el("div","day" + (d.type==="committed"?" committed":""));
    const hd = el("div","day-hd");
    const w = el("div","day-when");
    w.appendChild(el("div","d", d.dow));
    w.appendChild(el("div","n", d.date));
    hd.appendChild(w);
    const mid = el("div","day-mid");
    mid.appendChild(el("div","t", esc(d.title)));
    mid.appendChild(el("div","n2", esc(d.note)));
    const tg = el("div","day-tags");
    (d.tags||[]).forEach(t=> tg.appendChild(el("span","chip "+t.c, esc(t.t))));
    if(d.thaw) tg.appendChild(el("span","chip ice", esc(d.thaw.chip)));
    mid.appendChild(tg);
    hd.appendChild(mid);
    hd.appendChild(el("div","caret", ICONS.caret));
    c.appendChild(hd);

    const body = el("div","day-body");
    if(d.thaw){
      const tw = el("div","warn");
      tw.style.background="var(--ice-soft)"; tw.style.color="var(--ice)"; tw.style.marginTop="12px";
      tw.innerHTML = esc(d.thaw.detail);
      body.appendChild(tw);
    }
    body.appendChild(el("h4",null,"What you need"));
    const ul = el("ul");
    d.need.forEach(n=> ul.appendChild(el("li",null, esc(n))));
    body.appendChild(ul);
    body.appendChild(el("h4",null,"How"));
    const ol = el("ol");
    d.how.forEach(n=> ol.appendChild(el("li",null, esc(n))));
    body.appendChild(ol);
    body.appendChild(el("div","why","<b>Why it's here.</b> "+esc(d.why)));
    c.appendChild(body);

    hd.addEventListener("click", ()=> c.classList.toggle("open"));
    p.appendChild(c);
  });

  // (c) committed nights
  if(PLAN.committed.length){
    p.appendChild(el("div","sec-title","On the calendar"));
    PLAN.committed.forEach(n=>{
      const c = el("div","card");
      c.appendChild(el("h2",null, esc(n.title)));
      c.appendChild(el("p","small", esc(n.body)));
      p.appendChild(c);
    });
  }

  // (d) prep block
  p.appendChild(el("div","sec-title","Prep"));
  const pr = el("div","card day prep");
  pr.style.padding="14px";
  pr.appendChild(el("h2",null, esc(PLAN.prep.title)));
  const prTags = el("div","day-tags");
  prTags.appendChild(el("span","chip accent", esc(PLAN.prep.when)));
  prTags.appendChild(el("span","chip plain", esc(PLAN.prep.mins)));
  pr.appendChild(prTags);
  const pol = el("ol");
  pol.style.marginTop="12px";
  PLAN.prep.tasks.forEach(t=>{
    const li = el("li",null,"<b>"+esc(t.t)+"</b> <span class='chip plain'>"+esc(t.m)+"</span><div class='small' style='margin-top:3px'>"+esc(t.d)+"</div>");
    li.style.marginBottom="10px";
    pol.appendChild(li);
  });
  pr.appendChild(pol);
  pr.appendChild(el("div","why","<b>Why it's here.</b> "+esc(PLAN.prep.why)));
  p.appendChild(pr);

  // assumptions
  const a = el("div","card");
  a.appendChild(el("h3",null,"What changed, and what I assumed"));
  const aul = el("ul");
  PLAN.assumptions.forEach(x=> aul.appendChild(el("li",null, esc(x))));
  aul.className="small";
  a.appendChild(aul);
  p.appendChild(a);
}

/* ---------- SHOP tab ---------- */
function buildShop(){
  const p = $("#pane-shop"), S = PLAN.shop;
  const allItems = S.sections.reduce((a,s)=> a.concat(s.items.map(i=> Object.assign({sec:s.name}, i))), []);
  const grand = allItems.reduce((a,i)=> a+i.p, 0);
  const stockup = S.sections.filter(s=>s.stockup).reduce((a,s)=> a + s.items.reduce((x,i)=>x+i.p,0), 0);

  if(S.shopped){
    const done = el("div","card allset");
    done.appendChild(el("h2",null,"All set — shopping's done"));
    done.appendChild(el("p","small","Came home with everything on the list. Receipt total: <b>"+money(S.receiptTotal)+"</b>."));
    p.appendChild(done);
  }

  const total = el("div","total-card");
  const tl = el("div");
  tl.appendChild(el("div","big", money(grand)));
  tl.appendChild(el("div","lbl", esc(S.store)));
  total.appendChild(tl);
  const lb = el("div","left-badge");
  lb.appendChild(el("div","n","","")); lb.firstChild.id="itemsLeft";
  lb.appendChild(el("div","l","items left"));
  total.appendChild(lb);
  p.appendChild(total);

  const store = el("div","store-card");
  store.appendChild(el("div","sname", esc(S.store)));
  store.appendChild(el("div","stag", esc(S.tagline)));
  const m = el("div","meter"); const bar = el("i"); bar.id="bar"; m.appendChild(bar);
  store.appendChild(m);
  const mr = el("div","meter-row");
  const mrl = el("span"); mrl.id="mrCount";
  const mrr = el("span"); mrr.id="mrSub";
  mr.appendChild(mrl); mr.appendChild(mrr);
  store.appendChild(mr);

  S.sections.forEach(sec=>{
    const h = el("div","aisle");
    h.appendChild(el("span",null, esc(sec.name)));
    if(sec.stockup) h.appendChild(el("span","chip amber","Lasts months"));
    store.appendChild(h);
    if(sec.note) store.appendChild(el("div","small", esc(sec.note)));
    sec.items.forEach(it=>{
      const r = el("div","row");
      const bx = el("div","box", ICONS.check);
      const mid = el("div","row-mid");
      mid.appendChild(el("div","nm", esc(it.n)));
      if(it.t) mid.appendChild(el("div","nt", esc(it.t)));
      r.appendChild(bx); r.appendChild(mid);
      r.appendChild(el("div","pr", money(it.p)));
      r.dataset.price = it.p;
      r.addEventListener("click", ()=>{ r.classList.toggle("done"); recount(); });
      store.appendChild(r);
    });
  });
  p.appendChild(store);

  S.notes.forEach(n=>{
    const c = el("div","card");
    c.appendChild(el("h2",null, esc(n.h)));
    c.appendChild(el("p","small", esc(n.b)
      .replace("__STOCKUP__", money(stockup))
      .replace("__WEEKLY__", money(grand-stockup))));
    p.appendChild(c);
  });

  const rl = el("div","card");
  rl.appendChild(el("p","small","Check-offs live in memory only — they clear if you reload the page. That's on purpose; nothing is stored on your phone."));
  p.appendChild(rl);

  function recount(){
    const rows = p.querySelectorAll(".row");
    let done=0, sub=0;
    rows.forEach(r=>{ if(r.classList.contains("done")){ done++; sub += parseFloat(r.dataset.price); }});
    $("#itemsLeft").textContent = (rows.length - done);
    $("#bar").style.width = (rows.length ? (done/rows.length*100) : 0) + "%";
    $("#mrCount").textContent = done + " / " + rows.length + " picked up";
    $("#mrSub").textContent = "in cart " + money(sub);
  }
  recount();
}

/* ---------- SOS tab ---------- */
function buildSos(){
  const p = $("#pane-sos"), S = PLAN.sos;
  const hero = el("div","sos-hero");
  hero.appendChild(el("h2",null,"No plan. Kids are hungry."));
  hero.appendChild(el("p",null,"Pick a protein. Everything below is on the table in 20 minutes or less."));
  p.appendChild(hero);

  const fr = el("div","filters");
  S.filters.forEach((f,i)=>{
    const b = el("button","fbtn"+(i===0?" on":""), esc(f));
    b.type="button";
    b.addEventListener("click", ()=>{
      fr.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); render(f);
    });
    fr.appendChild(b);
  });
  p.appendChild(fr);

  const list = el("div"); list.id="sosList";
  p.appendChild(list);

  function render(f){
    list.innerHTML="";
    const ms = (f==="Everything") ? S.meals : S.meals.filter(m=> m.tags.indexOf(f)>-1);
    ms.forEach(m=>{
      const c = el("div","meal");
      const mm = el("div","mm");
      mm.appendChild(el("div","mn", esc(m.n)));
      mm.appendChild(el("div","mt", esc(m.t)));
      c.appendChild(mm);
      c.appendChild(el("span","chip green", esc(m.m)));
      list.appendChild(c);
    });
    if(!ms.length) list.appendChild(el("div","card","<p class='small'>Nothing matches — tap Everything.</p>"));
  }
  render("Everything");

  p.appendChild(el("div","sec-title","The emergency shelf"));
  const sh = el("div","card shelf-grid");
  Object.keys(S.shelf).forEach(k=>{
    const col = el("div","shelf-col");
    col.appendChild(el("h3",null, k));
    const ul = el("ul");
    S.shelf[k].forEach(x=> ul.appendChild(el("li",null, esc(x))));
    ul.className="small";
    col.appendChild(ul);
    sh.appendChild(col);
  });
  p.appendChild(sh);
  const fc = el("div","card");
  fc.appendChild(el("p","small", esc(S.footer)));
  p.appendChild(fc);
}
