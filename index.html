<style>
:root{
  --bg:#FBF7F1; --card:#FFFFFF; --ink:#22201D; --muted:#7A736A;
  --line:#EAE1D5; --accent:#C45D3B; --accent-soft:#FBEDE6;
  --green:#4F7A52; --green-soft:#EAF2E9;
  --amber:#B0781F; --amber-soft:#FBF0DC;
  --red:#B04A3A; --red-soft:#FBE9E5;
  --ice:#2F6D8C; --ice-soft:#E4F0F6;
  --shadow:0 1px 2px rgba(40,30,20,.06), 0 6px 18px rgba(40,30,20,.05);
  --tabh:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15130F; --card:#1E1B17; --ink:#F2EBE0; --muted:#A0968A;
    --line:#302B24; --accent:#E58154; --accent-soft:#2E2019;
    --green:#8FBF92; --green-soft:#1C2A1D;
    --amber:#E0AC55; --amber-soft:#2C2416;
    --red:#E58873; --red-soft:#2E1C18;
    --ice:#7FBAD6; --ice-soft:#16242B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg,var(--bg) 72%,rgba(251,247,241,0));
  padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;
}
@media (prefers-color-scheme: dark){
  header{background:linear-gradient(180deg,var(--bg) 72%,rgba(21,19,15,0))}
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(160deg,var(--accent),#7A3428);
  display:grid;place-items:center;color:#FFF3E8;font-size:15px
}
h1{font-size:19px;letter-spacing:-.02em;margin:0;font-weight:680}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.dot{opacity:.45;padding:0 5px}

/* ---------- layout ---------- */
main{padding:2px 16px 26px;max-width:640px;margin:0 auto}
.panel{display:none;animation:in .22s ease both}
.panel.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:22px 2px 9px}
.sec:first-child{margin-top:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;font-weight:640;padding:3.5px 9px;border-radius:999px;
  border:1px solid transparent;white-space:nowrap;letter-spacing:.01em}
.c-busy{background:var(--amber-soft);color:var(--amber)}
.c-fun{background:var(--accent-soft);color:var(--accent)}
.c-fast{background:var(--green-soft);color:var(--green)}
.c-plain{background:transparent;color:var(--muted);border-color:var(--line)}
.c-thaw{background:var(--ice-soft);color:var(--ice)}

/* ---------- week ---------- */
.day{width:100%;text-align:left;display:block;padding:14px 15px}
.day-top{display:flex;align-items:flex-start;gap:12px}
.day-emoji{font-size:27px;line-height:1.1;flex:0 0 auto;margin-top:1px}
.day-body{flex:1;min-width:0}
.day-label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.day-title{font-size:16.5px;font-weight:660;letter-spacing:-.015em;margin:2px 0 7px}
.caret{flex:0 0 auto;color:var(--muted);transition:transform .22s ease;margin-top:6px;font-size:13px}
.open .caret{transform:rotate(180deg)}
.detail{max-height:0;overflow:hidden;transition:max-height .3s ease}
.open .detail{max-height:2600px}
.detail-in{padding:2px 15px 15px 52px}
.recipe-meta{font-size:12.5px;color:var(--muted);line-height:1.5;
  padding:8px 11px;background:var(--bg);border-radius:9px;margin-top:4px}
.dl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:13px 0 5px}
.detail ul{margin:0;padding-left:17px}
.detail li{margin:3px 0;font-size:14.5px}
.detail ol{margin:0;padding-left:19px}
.detail ol li{margin:5px 0;font-size:14.5px}
.why{margin-top:13px;background:var(--accent-soft);border-radius:10px;padding:9px 11px;
  font-size:13.5px;color:var(--ink)}
.why b{color:var(--accent)}

/* ---------- shop ---------- */
.store{padding:0}
.store-hd{display:flex;align-items:center;gap:11px;width:100%;padding:13px 15px;text-align:left}
.store-name{font-size:16px;font-weight:660;flex:1;letter-spacing:-.01em}
.store-meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);border-radius:2px;margin:0 15px 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:2px;
  width:0;transition:width .25s ease}
.items{max-height:0;overflow:hidden;transition:max-height .35s ease}
.store.open .items{max-height:2600px}
.item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 15px;text-align:left;
  border-top:1px solid var(--line)}
.box{width:21px;height:21px;flex:0 0 auto;border:1.8px solid var(--line);border-radius:6px;
  display:grid;place-items:center;font-size:12px;color:transparent;transition:.15s}
.item.done .box{background:var(--green);border-color:var(--green);color:#fff}
.item-name{flex:1;font-size:14.5px;transition:.15s;min-width:0}
.item.done .item-name{opacity:.4;text-decoration:line-through}
.item-price{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.aisle{padding:11px 15px 4px;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);background:transparent}
.total{display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 16px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;box-shadow:var(--shadow);margin-bottom:10px}
.total-n{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);padding:0 3px;margin:14px 0 4px;line-height:1.55}

/* ---------- sos ---------- */
.sos-hd{background:linear-gradient(155deg,var(--accent),#8C3D28);color:#FFF3E8;
  border-radius:15px;padding:17px 17px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sos-hd h2{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.sos-hd p{margin:0;font-size:13.5px;opacity:.9;line-height:1.45}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13.5px;font-weight:600;transition:.15s}
.f.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meal{padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.meal-t{flex:1;min-width:0}
.meal-t h3{margin:0 0 3px;font-size:15.5px;font-weight:640;letter-spacing:-.01em}
.meal-t p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.time{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--green);
  background:var(--green-soft);padding:3.5px 8px;border-radius:7px;white-space:nowrap}
.shelf{padding:13px 15px}
.shelf h4{margin:0 0 3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.shelf p{margin:0 0 11px;font-size:14px;line-height:1.55;color:var(--ink)}
.shelf p:last-child{margin-bottom:0}

/* ---------- rules ---------- */
.rule{padding:14px 15px}
.rule h3{margin:0 0 7px;font-size:15.5px;font-weight:660;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px}
.rule p{margin:0 0 8px;font-size:14px;line-height:1.55;color:var(--ink)}
.rule p:last-child{margin-bottom:0}
.rule ul{margin:0 0 8px;padding-left:17px}
.rule li{font-size:14px;margin:4px 0;line-height:1.5}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.04em}
.t-no{background:var(--red-soft);color:var(--red)}
.t-yes{background:var(--green-soft);color:var(--green)}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:4px 9px;font-size:13px;margin:0 5px 5px 0}
.hill{background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;
  line-height:1.5;color:var(--ink);margin-top:4px}
.hill b{color:var(--red)}

/* ---------- tab bar ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--card);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)){
  nav{background:color-mix(in srgb,var(--card) 82%,transparent);
      backdrop-filter:saturate(180%) blur(20px);
      -webkit-backdrop-filter:saturate(180%) blur(20px)}
}
.tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--muted);transition:color .15s}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:640;letter-spacing:.01em}
footer{text-align:center;font-size:11.5px;color:var(--muted);padding:20px 0 4px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">🍲</div>
    <div>
      <h1>Peele Kitchen</h1>
      <div class="sub"><span id="weekRange"></span><span class="dot">·</span><span id="stamp"></span></div>
    </div>
  </div>
</header>

<main>
  <section class="panel on" id="p-week"></section>
  <section class="panel" id="p-shop"></section>
  <section class="panel" id="p-sos"></section>
  <section class="panel" id="p-rules"></section>
  <footer>Updated every Saturday morning.<br>Same link — just reopen it.</footer>
</main>

<nav>
  <button class="tab on" data-t="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Week</span></button>
  <button class="tab" data-t="shop"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.3 11.2a2 2 0 0 1-2 1.8H7.3a2 2 0 0 1-2-1.8Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span>Shop</span></button>
  <button class="tab" data-t="sos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>5pm SOS</span></button>
  <button class="tab" data-t="rules"><svg viewBox="0 0 24 24"><path d="M5 4h11l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M15 4v5h5M8.5 13.5l2 2 4-4"/></svg><span>Rules</span></button>
</nav>

<script>
/* ==========================================================================
   PLAN DATA — this is the only block that changes each Saturday.
   ========================================================================== */
const PLAN = {

      need:["1 whole chicken, 4–5 lb","2 Tbsp avocado oil","2 tsp kosher salt","1 tsp black pepper","1 tsp paprika","1 tsp garlic powder","1 lemon, halved","2 lb russet potatoes, cut in 1½-inch chunks","1 lb green beans, ends trimmed","2 Tbsp butter"],
      steps:[

    {

      title:"Slow-Cooker Chili",
      serves:"Serves 5 with leftovers",
      time:"10 min hands-on · 5 hrs in the cooker",
      chips:[["Busy night","c-busy"],["❄️ Beef out tonight","c-thaw"],["5 min at 1pm","c-fast"]],
      need:["1 lb browned ground beef (from Sunday prep)","1 can kidney beans, drained","1 can pinto beans, drained","1 can black beans, drained","2 cans (14.5 oz) diced tomatoes, undrained","1 large yellow onion, diced","2 Tbsp chili powder","1 tsp cumin","1 tsp garlic powder","1 tsp salt","To top: shredded cheddar, sour cream, Siete chips"],
      steps:[
        "<b>Around 1pm:</b> everything except the toppings into the slow cooker. Stir once. That is the entire job.",
        "<b>Low for 5 hours</b>, or high for 3 if you're starting late.",
        "Taste before serving — slow cookers mute salt, and it almost always wants another ½ tsp.",

      why:"<b>Busy night, zero evening cooking.</b> Five minutes at lunchtime buys you a finished dinner at six."
    },
    {
      day:"Tuesday", date:"Aug 4", emoji:"🍝",
      title:"Spaghetti + Hidden-Veg Meat Sauce",
      serves:"Serves 5",
      time:"20 min start to table",
      chips:[["Busy night","c-busy"],["❄️ Beef out tonight","c-thaw"],["20 min","c-fast"]],
      need:["1 lb spaghetti","1 lb browned ground beef (from Sunday prep)","1 jar (24 oz) marinara","1 zucchini, grated on a box grater","1 carrot, grated","1 tsp garlic powder","½ tsp salt","Cheddar or parmesan to finish"],

      why:"<b>Never fails, costs almost nothing, and the kids think they're getting away with something.</b> Good note to end the week on."

  ],

  thaw:{

    items:[

          ["Organic zucchini",3.99],["Whole carrots",2.50],["Baby carrots",1.59],

          ["White seedless grapes",6.88],["Mandarins",5.89],["Organic bananas",1.76]
        ]},
        {name:"Meat & Dairy", items:[
          ["GreenWise hickory bacon ×2",8.00],["Boar's Head maple honey turkey",12.31],
          ["Sharp cheddar wedge",5.99],["GreenWise sour cream",3.29],
          ["GreenWise Greek vanilla yogurt",6.29],["Purity whole chocolate milk",6.99]
        ]},
        {name:"Pantry", items:[
          ["Organic marinara ×2",5.29],["Organic kidney beans",1.49],
          ["Organic pinto beans",1.49],["Organic black beans",1.49],
          ["Extra-long grain rice",1.29],["Publix chili powder",2.49],
          ["GreenWise organic plant protein, vanilla",15.99]

  ready:"Everything the five dinners need is in the house. Shopping done, pantry checked, freezer reminder set for tonight. Nothing left to do but cook.",

/* ==========================================================================
   RENDER
   ========================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s);
const money = n => "$" + n.toFixed(2);

$("#weekRange").textContent = PLAN.weekRange;
$("#stamp").textContent = PLAN.stamp;

/* ---- Week ---- */
(function(){
  let h = '<div class="sec">Freezer — pull these out</div>'
    + '<div class="card" style="border-color:var(--ice)"><div class="rule">'
    + '<h3>❄️ '+PLAN.thaw.urgent+'</h3>'
    + PLAN.thaw.items.map(t=>'<p style="margin:0 0 9px"><b>'+t[0]+'</b><br>'
        + '<span style="color:var(--muted);font-size:13.5px">'+t[1]+'</span></p>').join('')
    + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 8px">'+PLAN.thaw.clear+'</p>'
    + '<div class="hill"><b>Rule:</b> '+PLAN.thaw.rule+'</div>'
    + '</div></div>'
    + '<div class="sec">This week\'s dinners</div>';
  PLAN.days.forEach((d,i) => {
    h += '<div class="card"><button class="day" data-day="'+i+'"><div class="day-top">'
      + '<div class="day-emoji">'+d.emoji+'</div><div class="day-body">'
      + '<div class="day-label">'+d.day+' · '+d.date+'</div>'
      + '<div class="day-title">'+d.title+'</div>'
      + '<div class="chips">'+d.chips.map(c=>'<span class="chip '+c[1]+'">'+c[0]+'</span>').join('')+'</div>'
      + '</div><div class="caret">▾</div></div></button>'
      + '<div class="detail"><div class="detail-in">'
      + '<div class="recipe-meta">'+d.serves+'<br>'+d.time+'</div>'
      + '<div class="dl">Ingredients</div><ul>'+d.need.map(n=>'<li>'+n+'</li>').join('')+'</ul>'
      + '<div class="dl">Method</div><ol>'+d.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'
      + '<div class="why">'+d.why+'</div>'
      + '</div></div></div>';
  });

  h += '<div class="card"><div class="rule" style="background:var(--accent-soft)">'
    + '<h3>🎉 Friday · Aug 7</h3><p style="margin:0">'+PLAN.friday+'</p></div></div>';

  h += '<div class="sec">Sunday prep block · '+PLAN.prep.mins+' min</div>'
    + '<div class="card"><div class="rule"><h3>🔪 '+PLAN.prep.when+'</h3><ul>'
    + PLAN.prep.tasks.map(t=>'<li>'+t+'</li>').join('')
    + '</ul><p style="color:var(--muted);margin-top:6px">Do this once and Monday through Thursday become assembly, not cooking.</p></div></div>';

    btn.addEventListener("click", () => btn.parentElement.classList.toggle("open"));
  });
})();

/* ---- Shop ---- */
(function(){
  let grand = 0;
  PLAN.stores.forEach(s => s.aisles.forEach(a => a.items.forEach(it => grand += it[1])));

  let h = '<div class="card" style="border-color:var(--green)"><div class="rule">'
    + '<h3><span class="tag t-yes">ALL SET</span> Ready for the week</h3>'
    + '<p style="margin:0">'+PLAN.ready+'</p></div></div>'
    + '<div class="total"><div><div style="font-size:12px;color:var(--muted);'
    + 'text-transform:uppercase;letter-spacing:.08em;font-weight:700">Spent Saturday</div>'
    + '<div style="font-size:13px;color:var(--muted);margin-top:3px" id="leftTxt">Nothing checked off yet</div></div>'
    + '<div class="total-n">'+money(PLAN.spent)+'</div></div>';

  PLAN.stores.forEach((s,si) => {
    const count = s.aisles.reduce((n,a)=>n+a.items.length,0);
    const sum = s.aisles.reduce((n,a)=>n+a.items.reduce((m,i)=>m+i[1],0),0);
    h += '<div class="card store'+(si===0?' open':'')+'" data-store="'+si+'">'
      + '<button class="store-hd"><div class="store-name">'+s.name+'</div>'
      + '<div class="store-meta"><span data-done="'+si+'">0</span>/'+count+' · '+money(sum)+'</div>'
      + '<div class="caret">▾</div></button>'
      + '<div style="padding:0 15px 10px;font-size:13px;color:var(--muted);margin-top:-6px">'+s.tagline+'</div>'
      + '<div class="bar"><i data-bar="'+si+'"></i></div>'
      + '<div class="items">';
    s.aisles.forEach(a => {
      h += '<div class="aisle">'+a.name+'</div>';
      a.items.forEach(it => {
        h += '<button class="item" data-s="'+si+'"><div class="box">✓</div>'
          + '<div class="item-name">'+it[0]+'</div>'
          + '<div class="item-price">'+money(it[1])+'</div></button>';
      });
    });
    h += '</div></div>';
  });

  h += '<div class="note"><b>Where things stand.</b> '+PLAN.skipNote+'</div>'
     + '<div class="note"><b>Notes.</b> '+PLAN.tier2+'</div>'
     + '<div class="note"><b>Budget.</b> '+PLAN.budgetNote+'</div>'
     + '<div class="note" style="opacity:.75">Check marks are just for this trip — they clear if you close and reopen the app.</div>';

  $("#p-shop").innerHTML = h;

  const box = $("#p-shop");
  box.querySelectorAll(".store-hd").forEach(b =>
    b.addEventListener("click", () => b.parentElement.classList.toggle("open")));

  function refresh(){
    let done = 0, total = 0;
    PLAN.stores.forEach((s,si) => {
      const items = box.querySelectorAll('.item[data-s="'+si+'"]');
      let d = 0;
      items.forEach(i => { if (i.classList.contains("done")) d++; });
      box.querySelector('[data-done="'+si+'"]').textContent = d;
      box.querySelector('[data-bar="'+si+'"]').style.width = (d/items.length*100)+"%";
      done += d; total += items.length;
    });
    const left = total - done;
    $("#leftTxt").textContent = left === 0
      ? "Everything accounted for"
      : (done === 0 ? "Publix, 8/1 · tap to check things off" : left + " item" + (left>1?"s":"") + " left");
  }

  box.querySelectorAll(".item").forEach(b =>
    b.addEventListener("click", () => { b.classList.toggle("done"); refresh(); }));
  refresh();
})();

/* ---- 5pm SOS ---- */
(function(){
  const FILTERS = [
    ["all","Everything"],["eggs","Eggs"],["beef","Ground beef"],
    ["chicken","Chicken"],["none","Pantry only"]
  ];
  let h = '<div class="sos-hd"><h2>No plan. Kids are hungry.</h2>'
    + '<p>Pick what you actually have. Dinner in 20 minutes beats 40 minutes of ordering and $60.</p></div>'
    + '<div class="filters">'
    + FILTERS.map((f,i)=>'<button class="f'+(i===0?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>').join('')
    + '</div><div id="sosList"></div>'
    + '<div class="sec">The always-stocked shelf</div><div class="card"><div class="shelf">'
    + PLAN.shelf.map(s=>'<h4>'+s[0]+'</h4><p>'+s[1]+'</p>').join('')
    + '</div></div>'
    + '<div class="note">Treat that shelf as infrastructure, not groceries. Anything that runs out goes on Saturday\'s list automatically.</div>';

  $("#p-sos").innerHTML = h;

  function draw(f){
    const list = PLAN.sos.filter(m => f === "all" || m.protein.includes(f));
    $("#sosList").innerHTML = list.length
      ? list.map(m => '<div class="card"><div class="meal"><div class="meal-t">'
          + '<h3>'+m.name+'</h3><p>'+m.note+'</p></div>'
          + '<div class="time">'+m.time+'</div></div></div>').join('')
      : '<div class="card"><div class="meal"><div class="meal-t"><h3>Nothing matches that</h3>'
        + '<p>Tap “Pantry only” — there is always something.</p></div></div></div>';
  }
  draw("all");

  $("#p-sos").querySelectorAll(".f").forEach(b => b.addEventListener("click", () => {
    $("#p-sos").querySelectorAll(".f").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    draw(b.dataset.f);
  }));
})();

/* ---- Rules ---- */
(function(){
  $("#p-rules").innerHTML = `
  <div class="sec">The Bobby Approved standard</div>
  <div class="card"><div class="rule">
    <h3><span class="tag t-no">AVOID</span> Red flags on a label</h3>
    <ul>
      <li><b>Seed oils</b> — canola, soybean, corn, cottonseed, "vegetable oil", standard sunflower/safflower, grapeseed</li>
      <li><b>Refined sugars</b> — cane sugar, HFCS, brown rice syrup, dextrose, maltodextrin</li>
      <li><b>Artificial sweeteners</b> — sucralose, aspartame, acesulfame-K</li>
      <li><b>Artificial colors &amp; flavors</b> — Red 40, Yellow 5, and friends</li>
      <li><b>"Natural flavors"</b> — the catch-all hiding spot</li>
      <li><b>Gums</b> — carrageenan especially; xanthan and guar are lesser flags</li>
      <li><b>Preservatives</b> — BHT, BHA, TBHQ, potassium sorbate, sodium benzoate, nitrates unless celery-based</li>
    </ul>
  </div></div>
  <div class="card"><div class="rule">
    <h3><span class="tag t-yes">SWAP</span> What good looks like</h3>
    <p><span class="pill">Avocado oil</span><span class="pill">Olive oil</span><span class="pill">Coconut oil</span>
    <span class="pill">Maple syrup</span><span class="pill">Honey</span><span class="pill">Coconut sugar</span>
    <span class="pill">Monk fruit</span><span class="pill">Dates</span></p>
    <p style="color:var(--muted)">Short label, real words, nothing you'd need to look up.</p>
  </div></div>
  <div class="card"><div class="rule">
    <h3>The pragmatism rule</h3>
    <p>A 90% clean cart that fits the budget beats a 100% cart that costs $400 and burns you out by week three.</p>
    <div class="hill"><b>Hills to die on:</b> seed oils, artificial colors, artificial sweeteners.
    <b>Acceptable tier-2:</b> a little cane sugar or xanthan gum in an otherwise-clean product when the budget says so.</div>
  </div></div>

  <div class="sec">Getting kids to eat it</div>
  <div class="card"><div class="rule">
    <h3>👧 What actually works at 10, 6 and 4</h3>
    <ul>
      <li>Serve the meal. <b>No alternatives offered</b>, no pressure to finish. They eat it when it's the only option — that's the proven pattern.</li>
      <li><b>Deconstruct for the 4-year-old</b> — same food, components separated on the plate. Never cook a second meal.</li>
      <li><b>Build-your-own wins across all three ages</b> — tacos, pizza, potato bar, quesadillas.</li>
      <li><b>Give the 10-year-old a job.</b> Shredding cheese, the air-fryer button, the timer. Ownership increases eating.</li>
      <li>A new food always rides alongside a guaranteed favorite. Never solo.</li>
    </ul>
  </div></div>
  <div class="card"><div class="rule">
    <h3>🔁 Swap, don't subtract</h3>
    <p>Nothing gets taken away — it gets rebuilt clean. Nuggets become almond-flour baked nuggets. Fries become real russets in avocado oil. Mac becomes real cheddar and butter. Pizza night becomes Friday at home.</p>
  </div></div>

  <div class="card"><div class="rule">
    <h3>❄️ Thaw timing, by protein</h3>
    <ul>
      <li><b>Whole chicken, 4–5 lb</b> — 24–36 hours in the fridge. Pull it two nights ahead.</li>
      <li><b>Ground beef, 1–2 lb</b> — 12–24 hours. The night before is fine.</li>
      <li><b>Chicken breasts or thighs, 1–2 lb</b> — 12–24 hours. Night before.</li>
      <li><b>Fish fillets</b> — 12 hours in the fridge, or 30 minutes in cold water if you forgot.</li>
      <li><b>Pork roast or beef roast, 3–4 lb</b> — a full 48 hours. These are the ones people underestimate.</li>
    </ul>
    <div class="hill"><b>Never the counter.</b> Room-temperature thawing puts the outside of the meat in the danger zone for hours while the middle is still frozen. Cold water in a sealed bag, changed every 30 minutes, is the only fast method worth using.</div>
  </div></div>

  <div class="sec">Lunchboxes &amp; school mornings</div>
  <div class="card"><div class="rule">
    <h3>🎒 What packs well and passes</h3>
    <ul>
      <li><b>Crackers</b> — Simple Mills almond flour. <b>Chips</b> — Siete, Jackson's sweet potato, Boulder Canyon avocado-oil.</li>
      <li><b>Protein</b> — string cheese, no-nitrate deli turkey roll-ups, hard-boiled eggs, peanut butter on apple slices, homemade oat + peanut butter protein bars.</li>
      <li><b>Sweet</b> — fruit, raisins or freeze-dried fruit with no added sugar, That's It fruit bars, dates with peanut butter, Simple Mills cookies, dark chocolate with a short label.</li>
      <li><b>Yogurt</b> — plain whole-milk Greek portioned into containers with a drizzle of honey. Never the pre-flavored kid tubes.</li>
      <li><b>Drinks</b> — water, or seltzer with a splash of real juice.</li>
    </ul>
  </div></div>
  <div class="card"><div class="rule">
    <h3><span class="tag t-no">TRAPS</span> The lunchbox aisle</h3>
    <p>Three categories are almost always red-flagged no matter how the box is marketed:</p>
    <ul>
      <li><b>Flavored kid yogurts and tubes</b> — sugar plus artificial colors, every time.</li>
      <li><b>"Fruit" snacks and fruit leathers</b> — candy with a produce photo on the front.</li>
      <li><b>Granola and breakfast bars</b> — seed oils, brown rice syrup, "natural flavors." A few clean ones exist; scan before trusting one.</li>
    </ul>
    <p style="color:var(--muted)">Portion into reusable containers on Sunday rather than buying single-serve. Cheaper, cleaner labels, less packaging.</p>
  </div></div>
  <div class="card"><div class="rule">
    <h3>🍳 Breakfast on a school clock</h3>
    <ul>
      <li><b>Sunday batch:</b> double the pancakes, freeze flat, toaster on weekday mornings.</li>
      <li><b>Overnight oats</b> — oats, milk, honey, frozen berries. Assemble five jars Sunday night.</li>
      <li><b>Hard-boiled eggs</b> — a dozen on Sunday covers breakfasts and lunchboxes both.</li>
      <li>Eggs and toast when there's time; nothing here needs a recipe.</li>
    </ul>
  </div></div>

  <div class="sec">How the week is built</div>
  <div class="card"><div class="rule">
    <h3>📅 The shape of every week</h3>
    <ul>
      <li>4 planned dinners — one headliner, three workhorses</li>
      <li>1 leftovers night (named, so it feels intentional)</li>
      <li>1 flex night — rotisserie chicken or breakfast for dinner</li>
      <li>1 fun night — pizza or burgers, so eating out loses its pull</li>
    </ul>
    <p>Busy evenings get a slow cooker or a sheet pan. Never a 45-minute recipe on a night with an activity. One new meal per week, maximum.</p>
  </div></div>
  <div class="card"><div class="rule">
    <h3>🛒 Store strategy</h3>
    <ul>
      <li><b>Aldi</b> — the budget backbone. Simply Nature organics at close to conventional prices.</li>
      <li><b>Kroger</b> — Simple Truth plus the clean-label specifics: avocado oil, Primal Kitchen, Siete.</li>
      <li><b>Publix</b> — GreenWise, when it's the convenient stop. BOGOs are worth stocking up on.</li>
      <li><b>Costco</b> — every 3–4 weeks for bulk staples. Single biggest budget lever, 30–50% under grocery prices.</li>
      <li><b>Whole Foods</b> — targeted, ≤10 items, never a full shop. That's how the budget died last time.</li>
    </ul>
    <p>Always shop from the list, ideally after eating.</p>
  </div></div>
  <div class="card"><div class="rule">
    <h3>🍓 Where organic actually matters</h3>
    <p><b>Buy organic</b> (Dirty Dozen): berries, apples, spinach, grapes, peaches, strawberries.</p>
    <p><b>Conventional is fine</b> (Clean Fifteen): avocado, banana, onion, corn, pineapple.</p>
    <p style="color:var(--muted)">This split alone reclaims most of the "buy everything organic" overspend.</p>
  </div></div>`;
